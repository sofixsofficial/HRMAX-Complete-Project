name: Build and Test

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [18.x, 20.x]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run TypeScript compiler
      run: npm run build
      env:
        # Use dummy Firebase config for build
        VITE_FIREBASE_API_KEY: dummy-api-key-for-ci
        VITE_FIREBASE_AUTH_DOMAIN: dummy-project.firebaseapp.com
        VITE_FIREBASE_PROJECT_ID: dummy-project
        VITE_FIREBASE_STORAGE_BUCKET: dummy-project.appspot.com
        VITE_FIREBASE_MESSAGING_SENDER_ID: 123456789
        VITE_FIREBASE_APP_ID: 1:123456789:web:dummy
        VITE_FIREBASE_MEASUREMENT_ID: G-DUMMY123

    - name: Run linter
      run: npm run lint
      continue-on-error: true

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist-files-${{ matrix.node-version }}
        path: dist/
        retention-days: 5

name: Build and Test

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        # Node 18 is EOL; SAM Lambda runs Node 22.
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/aws/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend/aws

      - name: Typecheck backend (Lambda code)
        run: npm run typecheck --prefix backend/aws

      - name: Backend smoke tests (node:test against dist/)
        run: npm test

      - name: Build frontend
        run: npm run build
        env:
          # Dummy AWS config for compile-time only (values are read at runtime).
          VITE_AWS_REGION: ap-southeast-2
          VITE_COGNITO_USER_POOL_ID: ap-southeast-2_CIDUMMY0000
          VITE_COGNITO_CLIENT_ID: dummyclientid000000000000000
          VITE_API_URL: https://dummy.execute-api.ap-southeast-2.amazonaws.com
          VITE_FILES_BUCKET_URL: https://dummy.s3.ap-southeast-2.amazonaws.com

      - name: Run linter
        run: npm run lint
        continue-on-error: true

      # The dist/ upload is a convenience copy of a build that already succeeded
      # above; GitHub's artifact storage quota can be exhausted account-wide
      # (usage recalculates every 6-12h), which must not fail the CI gate.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dist-files-${{ matrix.node-version }}
          path: frontend/dist/
          retention-days: 1

name: Deploy to AWS

# Replaces the old Firebase Hosting/Functions deploy.
# Requires one-time setup (see docs/deployment.md section 4):
#   1. GitHub repo secrets AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY for the
#      scoped deploy user (PowerUserAccess + this account's stack roles only)
#   2. GitHub repo secrets for the frontend build: VITE_AWS_REGION, VITE_COGNITO_USER_POOL_ID,
#      VITE_COGNITO_CLIENT_ID, VITE_API_URL, VITE_FILES_BUCKET_URL (values = sam deploy outputs)
#
# Auth note: this was OIDC (role-to-assume) until GitHub's tokens were rejected
# with InvalidIdentityToken for every audience - the account's OIDC provider
# fails AWS's certificate validation and an Organizations SCP denies
# iam:*OpenIDConnectProvider*, so it cannot be read or repaired from this
# account. Switch back to `role-to-assume` once the org admin fixes the
# provider; the IAM role hrmax-github-deploy is still in place for that.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            backend/aws/package-lock.json

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend/aws

      - name: Build frontend
        run: npm run build
        env:
          VITE_AWS_REGION: ${{ secrets.VITE_AWS_REGION }}
          VITE_COGNITO_USER_POOL_ID: ${{ secrets.VITE_COGNITO_USER_POOL_ID }}
          VITE_COGNITO_CLIENT_ID: ${{ secrets.VITE_COGNITO_CLIENT_ID }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_FILES_BUCKET_URL: ${{ secrets.VITE_FILES_BUCKET_URL }}

      - name: Build backend (tsc → dist/)
        run: npm run build:backend

      # Tests run against the built dist/ and MUST pass before anything ships —
      # this workflow previously deployed without running them at all.
      - name: Test backend (gate before deploy)
        run: npm test --prefix backend/aws

      - uses: aws-actions/setup-sam@v2

      - name: Deploy API (SAM → CloudFormation, stack hrmax-api)
        run: sam build -t backend/aws/template.yaml && sam deploy

      - name: Publish hosting (S3 sync + CloudFront invalidation)
        run: node scripts/deploy-hosting.mjs

name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Preinstalled SDK path on GitHub-hosted ubuntu images.
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # The hosted ubuntu-24.04 image already ships the Android SDK with the
      # licenses accepted. android-actions/setup-android@v3 hard-fails on it:
      # it runs `sdkmanager tools`, and the legacy `tools` package no longer
      # exists in cmdline-tools 16 ("Failed to find package 'tools'" → exit 1),
      # which is exactly why every previous APK run died at this step.
      - name: Android SDK (preinstalled on runner)
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          test -d "${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          ls "${ANDROID_HOME:-/usr/local/lib/android/sdk}"

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Prebuild
        working-directory: mobile-app
        run: npx expo prebuild --platform android --no-install

      - name: Build APK
        working-directory: mobile-app/android
        run: ./gradlew assembleRelease --no-daemon

      # The account's Actions artifact storage quota is currently exhausted
      # (upload returns "Artifact storage quota has been hit" for ~6-12h),
      # which failed the whole run after a successful gradle build. The APK
      # is a convenience copy - the store build comes from EAS - so a quota
      # error must not turn this workflow red.
      - name: Upload APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: mobile-app/android/app/build/outputs/apk/release/*.apk
          retention-days: 30

      - name: Upload debug APK
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: mobile-app/android/app/build/outputs/apk/debug/*.apk
          retention-days: 30

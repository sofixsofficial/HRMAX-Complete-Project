name: Android AAB Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile-app/package-lock.json

      - name: Setup JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        working-directory: mobile-app
        run: npm ci

      - name: Run Expo prebuild (Android)
        working-directory: mobile-app
        env:
          CI: "1"
        run: npx expo prebuild --platform android --no-install

      - name: Restore release signing key
        working-directory: mobile-app
        run: |
          echo "${{ secrets.HRMAX_KEYSTORE_B64 }}" | base64 -d > android/app/hrmax-upload.jks
          # The prebuild-written gradle.properties has NO trailing newline, so
          # appending directly glued the first key onto the last line:
          #   expo.inlineModules.watchedDirectories=[]HRMAX_UPLOAD_STORE_FILE=...
          # Gradle then handed that whole string to expo autolinking's
          # --watched-directories-serialized, whose JSON.parse crashed node
          # (exit 1) during configuration - and the HRMAX_* signing properties
          # never existed at all. Always start with a newline.
          printf '\n' >> android/gradle.properties
          cat >> android/gradle.properties <<'EOF'
          HRMAX_UPLOAD_STORE_FILE=hrmax-upload.jks
          HRMAX_UPLOAD_STORE_PASSWORD=${{ secrets.HRMAX_KEYSTORE_PASSWORD }}
          HRMAX_UPLOAD_KEY_ALIAS=${{ secrets.HRMAX_KEY_ALIAS }}
          HRMAX_UPLOAD_KEY_PASSWORD=${{ secrets.HRMAX_KEY_PASSWORD }}
          EOF
          printf '\norg.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g\n' >> android/gradle.properties

      - name: Configure release signing in build.gradle
        working-directory: mobile-app
        run: node scripts/configure-release-signing.js

      - name: Build release AAB
        working-directory: mobile-app/android
        env:
          NODE_OPTIONS: "--max-old-space-size=6144"
        run: |
          ./gradlew bundleRelease --no-daemon --stacktrace

      # Play Console's registered upload key is the ORIGINAL project key
      # (SHA1 45:25:1c02...): the app's Play App Signing enrollment was made
      # with it and Play rejects anything else with "signed with the wrong
      # key". The regenerated e89e... key (created after an `expo prebuild`
      # wiped the gitignored android/ tree) was refused by Play, so the
      # original keystore was restored from the pre-migration project copy
      # (Desktop\Sofixs-HRM). NEVER regenerate this key.
      - name: Verify AAB signature
        working-directory: mobile-app/android
        run: |
          AAB=app/build/outputs/bundle/release/app-release.aab
          ls -la "$AAB"
          SHA1=$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA1: //p' | tr -d ':' | tr 'A-F' 'a-f')
          echo "Cert SHA1: $SHA1"
          if [ "$SHA1" != "45251c026d92a4a4ce19b061c68787663a724336" ]; then
            echo "::error::AAB SHA1 fingerprint mismatch — expected 45251c026d92a4a4ce19b061c68787663a724336 (original Play upload key)"
            exit 1
          fi
          echo "AAB signed with expected Play upload key. OK"

      # Store upload copy — without this the verified AAB vanished with the
      # runner. continue-on-error so a quota hiccup never fails the build
      # (same policy as the APK workflow's uploads).
      - name: Upload AAB
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: mobile-app/android/app/build/outputs/bundle/release/*.aab
          retention-days: 30
version = 0.1

# Non-interactive defaults for `sam build && sam deploy` in backend/aws.
# Created for the HR MAX stack (deployed from the repo root with
# `-t backend/aws/template.yaml`, or from backend/aws with the relative
# template path below).
[default.build.parameters]
template = "backend/aws/template.yaml"

[default.deploy.parameters]
stack_name = "hrmax-api"
region = "ap-southeast-2"
resolve_s3 = true
capabilities = "CAPABILITY_IAM CAPABILITY_NAMED_IAM CAPABILITY_AUTO_EXPAND"
confirm_changeset = false
fail_on_empty_changeset = false

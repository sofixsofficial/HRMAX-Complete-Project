AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Metadata:
  AWS::ServerlessRepo::Application:
    Name: HRMAX
    Description: >
      Complete HR management platform: Cognito auth, DynamoDB single-table
      data layer, Lambda API, S3/CloudFront hosting and file storage, SES
      email, and EventBridge scheduled jobs.
    Author: Sofixs Company
    SourceCodeUrl: https://github.com/sofixscompany-code/HR-MAX
    LicenseUrl: ./LICENSE.txt
    ReadmeUrl: ./SAR-README.md
Description: >
  HR MAX — complete AWS infrastructure.
  Cognito (auth) + DynamoDB (data) + API Gateway/Lambda (API) + S3/CloudFront
  (web hosting + file storage) + SES (email) + EventBridge (scheduled jobs).

Parameters:
  AppDomain:
    Type: String
    Default: ''
    Description: Custom domain for CloudFront (empty = default *.cloudfront.net)
  EmailFrom:
    Type: String
    Default: info@hrmax.in
    Description: Verified sender address (display From; SMTP transport overrides with the Zoho mailbox)
  ZohoSmtpUser:
    Type: String
    Default: ''
    Description: Zoho Mail SMTP login (e.g. info@hrmax.in). Empty = fall back to Amazon SES.
  ZohoSmtpPass:
    Type: String
    Default: ''
    NoEcho: true
    Description: Zoho Mail app password (Zoho Accounts > Security > App Passwords). Never the normal password.
  ZohoSmtpHost:
    Type: String
    Default: smtp.zoho.in
    Description: Zoho SMTP host (smtp.zoho.in for India DC, smtp.zoho.com otherwise)
  ZohoSmtpPort:
    Type: String
    Default: '465'
    Description: 465 (SSL) or 587 (STARTTLS)

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        TABLE_NAME: !Ref HRMaxTable
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        FILES_BUCKET: !Ref FilesBucket
        EMAIL_FROM: !Ref EmailFrom
        EMAIL_FROM_NAME: HR MAX
        # Zoho SMTP (primary transport when ZOHO_USER+ZOHO_PASS are set;
        # otherwise the email service falls back to SES)
        ZOHO_USER: !Ref ZohoSmtpUser
        ZOHO_PASS: !Ref ZohoSmtpPass
        ZOHO_SMTP_HOST: !Ref ZohoSmtpHost
        ZOHO_SMTP_PORT: !Ref ZohoSmtpPort
        APP_URL: !If [HasAppDomain, !Sub 'https://${AppDomain}', !Sub 'https://${WebDistribution.DomainName}']
    Architectures: [arm64]

# Invite/reset links in emails point at the deployed web app: the custom
# domain when one is configured, otherwise the CloudFront domain.
Conditions:
  HasAppDomain: !Not [!Equals [!Ref AppDomain, '']]

Resources:
  # ================================================================ COGNITO
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hrmax-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      LambdaConfig:
        # Injects custom:role / custom:companyId claims on every token issue
        # (sign-in and refresh — parity with Firebase setCustomUserClaims).
        PreTokenGeneration: !GetAtt PreTokenFn.Arn
        # Auto-confirms self sign-ups so signUpCompany can sign the new admin
        # in immediately (Firebase createUserWithEmailAndPassword parity).
        PreSignUp: !GetAtt PreSignUpFn.Arn
      Policies:
        PasswordPolicy:
          # Relaxed to match the live pool (min 6, no complexity) so the six
          # provisioned accounts can reset to their chosen passwords. Keep this
          # in sync with the deployed pool or the next deploy will silently
          # revert it and break resets.
          MinimumLength: 6
          RequireLowercase: false
          RequireNumbers: false
          RequireSymbols: false
          RequireUppercase: false
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: companyId
          AttributeDataType: String
          Mutable: true
          Required: false
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hrmax-clients
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  # PreTokenGeneration trigger — injects custom:role / custom:companyId claims
  # from the users table into the JWT (parity with Firebase custom claims).
  PreTokenFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-pretoken
      CodeUri: ./
      Handler: dist/triggers/pretoken.handler
      # Overrides for the Globals environment: the pool's LambdaConfig now
      # points back at this function, so it must not !Ref the pool/client
      # (that would be a circular dependency). The trigger doesn't need
      # either value at runtime — it reads event.request.userAttributes and
      # the users table only.
      Environment:
        Variables:
          TABLE_NAME: !Ref HRMaxTable
          COGNITO_USER_POOL_ID: ''
          COGNITO_CLIENT_ID: ''
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HRMaxTable

  # Cognito invokes the trigger via a resource-based permission; the pool's
  # LambdaConfig (below) points at PreTokenFn, so the permission must exist
  # for token issuance to succeed.
  PreTokenInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreTokenFn.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # PreSignUp trigger — auto-confirms self sign-ups (Firebase parity: the
  # original flow signed users in immediately; email verification was a
  # notification, not a login gate). Environment overridden like PreTokenFn
  # to avoid a circular dependency with the pool.
  PreSignUpFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-presignup
      CodeUri: ./
      Handler: dist/triggers/presignup.handler
      Environment:
        Variables:
          TABLE_NAME: !Ref HRMaxTable
          COGNITO_USER_POOL_ID: ''
          COGNITO_CLIENT_ID: ''
      Timeout: 10

  PreSignUpInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt PreSignUpFn.Arn
      Action: lambda:InvokeFunction
      Principal: cognito-idp.amazonaws.com
      SourceArn: !GetAtt UserPool.Arn

  # ================================================================ DYNAMODB
  HRMaxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HRMAX
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }

  # ================================================================ LAMBDA API
  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-api
      CodeUri: ./
      Handler: dist/index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/{proxy+}'
            Method: ANY
        ApiRoot:
          Type: HttpApi
          Properties:
            ApiId: !Ref HttpApi
            Path: '/'
            Method: ANY
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HRMaxTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - ses:SendTemplatedEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      # Auth is enforced in the Lambda handlers: lib/auth.ts validates the
      # Cognito JWT per route, and public routes (health, invite probe,
      # reset, forgot-password) pass through anonymously — mirroring the
      # original Firebase per-callable auth checks.
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]
      # Stage-level default throttle headroom. NOTE: per-route RouteSettings
      # CANNOT be used here — every route is served by the ANY /{proxy+}
      # catch-all, so explicit route keys like "POST /api/auth/..."
      # do not exist and CloudFormation fails the update (tried & rolled back).
      # The strict brute-force limits on forgot/reset/verify/change/invite
      # live in code instead: src/lib/rateLimit.ts (DynamoDB fixed-window
      # counters, accurate across Lambda instances).
      DefaultRouteSettings:
        ThrottlingBurstLimit: 200
        ThrottlingRateLimit: 100

  # ================================================================ SCHEDULER
  SchedulerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-scheduler
      CodeUri: ./
      Handler: dist/scheduler.schedulerHandler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HRMaxTable

  # dailyAttendanceSweep — 23:30 IST = 18:00 UTC
  SweepRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(0 18 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: dailyAttendanceSweep
          Input: '{"detail":{"job":"dailyAttendanceSweep"}}'

  # missedPunchCutoffAlert — 21:30 IST Mon–Fri = 16:00 UTC
  CutoffRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(0 16 ? * 1-5 *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: missedPunchCutoffAlert
          Input: '{"detail":{"job":"missedPunchCutoffAlert"}}'

  # monthlyPayrollReminder — 08:00 IST on the 1st = 02:30 UTC
  PayrollRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(30 2 1 * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: monthlyPayrollReminder
          Input: '{"detail":{"job":"monthlyPayrollReminder"}}'

  SchedulerInvokeSweep:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepRule.Arn
  SchedulerInvokeCutoff:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CutoffRule.Arn
  SchedulerInvokePayroll:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PayrollRule.Arn

  # ================================================================ STORAGE
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hrmax-files-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Web hosting bucket (private, CloudFront-fronted)
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hrmax-web-${AWS::AccountId}

  # Origin Access Control — CloudFront signs origin requests (S3 policy only
  # grants the signed OAC path).
  # NOTE: This repo template is the LIVE-stack template and uses OAC (modern,
  # matches the deployed stack). SAR publishing rejects the OAC resource type,
  # so `sam publish` uses a separate OAI-variant template generated at publish
  # time — do NOT swap this live template back to OAI (in-place OAC->OAI
  # migration breaks the origin and returns 403; OAI only works on fresh deploys).
  # The -v2 suffix exists because an earlier troubleshooting session created an
  # OAC named "hrmax-api-web-oac" OUTSIDE the stack (CloudFormation cannot
  # import or adopt it — its physical ID is not expressible in the template),
  # which made every deploy fail with AlreadyExists. The -v2 name lets
  # CloudFormation create and own this resource; the manual one is deleted
  # after the first successful deploy.
  WebOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-web-oac-v2
        Description: OAC for the HR MAX web bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: s3-web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt WebOAC.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Description: HR MAX API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FilesBucketName:
    Value: !Ref FilesBucket
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontUrl:
    Value: !Sub https://${WebDistribution.DomainName}

  CloudFrontDistributionId:
    Description: CloudFront distribution ID (for invalidations)
    Value: !Ref WebDistribution
  TableName:
    Value: !Ref HRMaxTable

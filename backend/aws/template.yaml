AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: >
  HR MAX — complete AWS infrastructure.
  Cognito (auth) + DynamoDB (data) + API Gateway/Lambda (API) + S3/CloudFront
  (web hosting + file storage) + SES (email) + EventBridge (scheduled jobs).

Parameters:
  AppDomain:
    Type: String
    Default: ''
    Description: Custom domain for CloudFront (empty = default *.cloudfront.net)
  EmailFrom:
    Type: String
    Default: no-reply@hrmax.in
    Description: SES verified sender address

Globals:
  Function:
    Runtime: nodejs22.x
    Timeout: 60
    MemorySize: 1024
    Environment:
      Variables:
        TABLE_NAME: !Ref HRMaxTable
        COGNITO_USER_POOL_ID: !Ref UserPool
        COGNITO_CLIENT_ID: !Ref UserPoolClient
        EMAIL_FROM: !Ref EmailFrom
        EMAIL_FROM_NAME: HR MAX
        APP_URL: !Ref AppUrl
    Architectures: [arm64]

Resources:
  # ================================================================ COGNITO
  UserPool:
    Type: AWS::Cognito::UserPool
    Properties:
      UserPoolName: hrmax-users
      AutoVerifiedAttributes: [email]
      UsernameAttributes: [email]
      Policies:
        PasswordPolicy:
          MinimumLength: 8
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: false
          RequireUppercase: true
      Schema:
        - Name: role
          AttributeDataType: String
          Mutable: true
          Required: false
        - Name: companyId
          AttributeDataType: String
          Mutable: true
          Required: false
      VerificationMessageStyle: code
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: hrmax-clients
      UserPoolId: !Ref UserPool
      ExplicitAuthFlows:
        - ALLOW_USER_PASSWORD_AUTH
        - ALLOW_REFRESH_TOKEN_AUTH
        - ALLOW_USER_SRP_AUTH
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED

  # PreTokenGeneration trigger — injects custom:role / custom:companyId claims
  # from the users table into the JWT (parity with Firebase custom claims).
  PreTokenFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-pretoken
      CodeUri: backend/aws/src/triggers/
      Handler: pretoken.handler
      Timeout: 10
      Policies:
        - DynamoDBReadPolicy:
            TableName: !Ref HRMaxTable

  UserPoolInvokePreToken:
    Type: AWS::Cognito::UserPoolLambdaTrigger
    Properties:
      FunctionName: !Ref PreTokenFn
      UserPoolId: !Ref UserPool
      TriggerSource: PreTokenGeneration_RefreshTokens

  # ================================================================ DYNAMODB
  HRMaxTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: HRMAX
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
        - AttributeName: GSI1PK
          AttributeType: S
        - AttributeName: GSI1SK
          AttributeType: S
        - AttributeName: GSI2PK
          AttributeType: S
        - AttributeName: GSI2SK
          AttributeType: S
        - AttributeName: GSI3PK
          AttributeType: S
        - AttributeName: GSI3SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      GlobalSecondaryIndexes:
        - IndexName: GSI1
          KeySchema:
            - AttributeName: GSI1PK
              KeyType: HASH
            - AttributeName: GSI1SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI2
          KeySchema:
            - AttributeName: GSI2PK
              KeyType: HASH
            - AttributeName: GSI2SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }
        - IndexName: GSI3
          KeySchema:
            - AttributeName: GSI3PK
              KeyType: HASH
            - AttributeName: GSI3SK
              KeyType: RANGE
          Projection: { ProjectionType: ALL }

  # ================================================================ LAMBDA API
  ApiFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-api
      CodeUri: backend/aws/
      Handler: dist/index.handler
      Events:
        Api:
          Type: HttpApi
          Properties:
            Path: '/{proxy+}'
            Method: ANY
            Auth:
              Authorizer: COGNITO
        ApiRoot:
          Type: HttpApi
          Properties:
            Path: '/'
            Method: ANY
            Auth:
              Authorizer: COGNITO
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HRMaxTable
        - Statement:
            - Effect: Allow
              Action:
                - ses:SendEmail
                - ses:SendRawEmail
                - ses:SendTemplatedEmail
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - cognito-idp:AdminCreateUser
                - cognito-idp:AdminSetUserPassword
                - cognito-idp:AdminDeleteUser
                - cognito-idp:AdminUpdateUserAttributes
                - cognito-idp:AdminGetUser
                - cognito-idp:AdminInitiateAuth
              Resource: !GetAtt UserPool.Arn

  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      Auth:
        DefaultAuthorizer: COGNITO
        Authorizers:
          CognitoOAuth2:
            UserPoolArn: !GetAtt UserPool.Arn
            Identity:
              Headers: [Authorization]
        # Public routes bypass auth at the app level (health, invite probe, reset)
      CorsConfiguration:
        AllowOrigins: ['*']
        AllowHeaders: [authorization, content-type]
        AllowMethods: [GET, POST, PUT, PATCH, DELETE, OPTIONS]

  # ================================================================ SCHEDULER
  SchedulerFn:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: hrmax-scheduler
      CodeUri: backend/aws/
      Handler: dist/scheduler.schedulerHandler
      Timeout: 300
      Policies:
        - DynamoDBCrudPolicy:
            TableName: !Ref HRMaxTable

  # dailyAttendanceSweep — 23:30 IST = 18:00 UTC
  SweepRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(0 18 * * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: dailyAttendanceSweep
          Input: '{"detail":{"job":"dailyAttendanceSweep"}}'

  # missedPunchCutoffAlert — 21:30 IST Mon–Fri = 16:00 UTC
  CutoffRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(0 16 * * 1-5 *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: missedPunchCutoffAlert
          Input: '{"detail":{"job":"missedPunchCutoffAlert"}}'

  # monthlyPayrollReminder — 08:00 IST on the 1st = 02:30 UTC
  PayrollRule:
    Type: AWS::Events::Rule
    Properties:
      ScheduleExpression: cron(30 2 1 * ? *)
      State: ENABLED
      Targets:
        - Arn: !GetAtt SchedulerFn.Arn
          Id: monthlyPayrollReminder
          Input: '{"detail":{"job":"monthlyPayrollReminder"}}'

  SchedulerInvokeSweep:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt SweepRule.Arn
  SchedulerInvokeCutoff:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt CutoffRule.Arn
  SchedulerInvokePayroll:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref SchedulerFn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt PayrollRule.Arn

  # ================================================================ STORAGE
  FilesBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hrmax-files-${AWS::AccountId}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders: ['*']
            AllowedMethods: [GET, PUT, POST]
            AllowedOrigins: ['*']
            MaxAge: 3600
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  # Web hosting bucket (private, CloudFront-fronted)
  WebBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub hrmax-web-${AWS::AccountId}

  WebDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        HttpVersion: http2
        Origins:
          - Id: s3-web
            DomainName: !GetAtt WebBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: s3-web
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6  # CachingOptimized
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  WebBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref WebBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${WebBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${WebDistribution}

Outputs:
  ApiUrl:
    Description: HR MAX API base URL
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  FilesBucketName:
    Value: !Ref FilesBucket
  WebBucketName:
    Value: !Ref WebBucket
  CloudFrontUrl:
    Value: !Sub https://${WebDistribution}.cloudfront.net
  TableName:
    Value: !Ref HRMaxTable
